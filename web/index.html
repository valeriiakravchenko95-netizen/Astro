<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Натальная карта - расчет</title>
<meta name="description" content="Расчет натальной карты: положения планет, дома, аспекты и разбор по темам. Считается прямо в браузере, данные никуда не отправляются.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Превью ссылки в мессенджерах. Адрес сайта __SITE_URL__ подставляется при
     публикации (.github/workflows/pages.yml): картинке нужен полный адрес. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Натальная карта: разбор по темам">
<meta property="og:description" content="Характер, деньги, отношения, предназначение - и что из неба заденет именно тебя. Бесплатно, прямо в браузере.">
<meta property="og:image" content="__SITE_URL__/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="__SITE_URL__/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>Натальная карта</h1>
    <p>Положения планет, дома, аспекты и разбор по темам. Расчет идет прямо в твоем браузере: дата и место рождения никуда не отправляются.</p>
  </header>

  <form class="card" id="form">
    <div class="field">
      <label for="date">Дата рождения</label>
      <input type="date" id="date" required>
    </div>

    <div class="field">
      <label for="time">Время рождения</label>
      <input type="time" id="time">
      <label class="check">
        <input type="checkbox" id="unknown-time">
        Времени не знаю
      </label>
    </div>

    <div class="field">
      <label for="place">Место рождения</label>
      <input type="text" id="place" autocomplete="off" placeholder="Город, можно по-русски">
      <div class="suggest" id="suggest" hidden></div>
    </div>

    <fieldset class="field gender">
      <legend>Обращаться ко мне</legend>
      <label class="check"><input type="radio" name="gender" value="f" checked> в женском роде</label>
      <label class="check"><input type="radio" name="gender" value="m"> в мужском роде</label>
    </fieldset>

    <button type="submit" id="submit" disabled>Загружаю данные...</button>
    <p class="status" id="status"></p>
  </form>

  <div id="result" hidden></div>

  <footer>
    <p>Расчет по эфемеридам JPL. Ничего не сохраняется и никуда не передается.</p>
    <p>Список городов: <a href="https://www.geonames.org/" rel="noopener">GeoNames</a>,
       лицензия <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a>.</p>
  </footer>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
