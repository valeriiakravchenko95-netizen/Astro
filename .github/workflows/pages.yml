# Публикация страницы расчёта на GitHub Pages.
#
# Включается один раз: в настройках репозитория, раздел Pages, источником
# нужно выбрать GitHub Actions. После этого каждая правка в рабочей ветке
# сама попадает на страницу за пару минут.

name: Публикация страницы

on:
  push:
    # Ветка по умолчанию в этом репозитории не main, поэтому она названа
    # явно. Если позже переименуете — поправьте и здесь.
    branches: [claude/astro-telegram-bot-xnz1wj, main]
    paths: ['web/**', 'content/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; начатую не обрываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что данные на месте
        run: |
          test -s web/data/ephemeris.bin || { echo "нет таблиц эфемерид"; exit 1; }
          test -s web/data/cities.json || { echo "нет списка городов"; exit 1; }
          for f in web/content/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done

      - id: pages
        uses: actions/configure-pages@v5

      # Превью ссылки требует полного адреса картинки, а он известен только
      # здесь: у GitHub Pages свой, у своего домена свой.
      - name: Подставить адрес сайта
        run: sed -i "s#__SITE_URL__#${{ steps.pages.outputs.base_url }}#g" web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
